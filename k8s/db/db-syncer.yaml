apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-syncer-sa
  namespace: gitops-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-syncer-role
  namespace: gitops-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-syncer-rolebinding
  namespace: gitops-demo
subjects:
  - kind: ServiceAccount
    name: db-syncer-sa
    namespace: gitops-demo
roleRef:
  kind: Role
  name: db-syncer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-syncer
  namespace: gitops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-syncer
  template:
    metadata:
      labels:
        app: db-syncer
    spec:
      serviceAccountName: db-syncer-sa
      containers:
        - name: db-syncer
          image: gitops-demo-db-syncer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: configdb
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: postgres
            - name: NAMESPACE
              value: gitops-demo
            - name: SYNC_INTERVAL_SECONDS
              value: "5"
          resources:
            requests:
              cpu: "30m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
