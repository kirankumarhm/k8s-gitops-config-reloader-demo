apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-service
  namespace: gitops-demo
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-service
  template:
    metadata:
      labels:
        app: springboot-service
    spec:
      containers:
        - name: springboot-service
          image: gitops-demo-springboot-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: springboot-config
          env:
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: API_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-service
  namespace: gitops-demo
spec:
  selector:
    app: springboot-service
  ports:
    - port: 8081
      targetPort: 8081
