apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitops-config-demo
  namespace: argocd
spec:
  description: Project for GitOps ConfigMaps & Reloader Polyglot Demo
  sourceRepos:
    - '*'
  destinations:
