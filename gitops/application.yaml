apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-polyglot-config-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kirankumarhm/k8s-gitops-config-reloader-demo.git
    targetRevision: HEAD
    path: k8s/overlays/minikube
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
